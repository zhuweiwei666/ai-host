# ============================================================
# Rate Limiting Zones (must be outside server block)
# ============================================================
# General API rate limit: 10 req/s per IP with burst
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

# Strict rate limit for auth/sync: 2 req/s per IP
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;

# Expensive operations (image/video gen): 1 req/5s per IP
limit_req_zone $binary_remote_addr zone=api_expensive:10m rate=12r/m;

# Chat endpoint: 5 req/s per IP
limit_req_zone $binary_remote_addr zone=api_chat:10m rate=5r/s;

# Wallet/billing: 3 req/s per IP
limit_req_zone $binary_remote_addr zone=api_wallet:10m rate=3r/s;

# ============================================================
# HTTP server - redirect to HTTPS
# ============================================================
server {
    listen 80;
    server_name cling-ai.com www.cling-ai.com;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# ============================================================
# HTTPS server
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name cling-ai.com www.cling-ai.com;

    # SSL certificate configuration
    ssl_certificate /etc/nginx/ssl/cling-ai.com.crt;
    ssl_certificate_key /etc/nginx/ssl/cling-ai.com.key;
    
    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Request size limits (reduced from 500M for security)
    # Large uploads should go through OSS presigned URLs
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 30s;
    
    # Connection limits
    keepalive_timeout 30s;
    send_timeout 30s;

    # Normalize double slashes in URLs (fix iOS client issue)
    merge_slashes off;

    # Proxy Uploads to Main Backend (MUST be before static file rules!)
    location /uploads/ {
        proxy_pass http://ai-host-backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files directly (images, fonts, etc.) - EXCLUDE /uploads/
    location ~* ^(?!/uploads/).+\.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|css|js)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Serve SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to AI Wallet Service (must be before general /api/ rule)
    location /api/ai-wallet/ {
        proxy_pass http://ai-wallet:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ============================================================
    # Rate-limited API endpoints (specific paths before general)
    # ============================================================
    
    # Auth/sync - strict rate limit (prevent brute force)
    location ~ ^/+api/users/sync$ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://ai-host-backend:4000/api/users/sync$is_args$args;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    
    # Image generation - expensive operation
    location ~ ^/+api/generate-image {
        limit_req zone=api_expensive burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://ai-host-backend:4000/api/generate-image$is_args$args;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_read_timeout 120s;
    }
    
    # Video generation - very expensive
    location ~ ^/+api/generate-video {
        limit_req zone=api_expensive burst=2 nodelay;
        limit_req_status 429;
        
        proxy_pass http://ai-host-backend:4000/api/generate-video$is_args$args;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_read_timeout 300s;
    }
    
    # Chat endpoints
    location ~ ^/+api/chat {
        limit_req zone=api_chat burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://ai-host-backend:4000/api/chat$is_args$args;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_read_timeout 60s;
    }
    
    # Wallet/billing - financial, rate limit
    location ~ ^/+api/(wallet|billing) {
        limit_req zone=api_wallet burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://ai-host-backend:4000/api/$1$is_args$args;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    
    # OSS proxy - potential abuse vector
    location ~ ^/+api/oss/proxy {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://ai-host-backend:4000/api/oss/proxy$is_args$args;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    
    # ============================================================
    # General API proxy (fallback for other endpoints)
    # ============================================================
    # Handle both /api/ and //api/ (double slash) for iOS client compatibility
    location ~ ^/+api/(.*)$ {
        limit_req zone=api_general burst=30 nodelay;
        limit_req_status 429;
        
        proxy_pass http://ai-host-backend:4000/api/$1$is_args$args;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

}

